{% extends "base.html" %}
{% block title %}Elegir nueva contraseña · Portal Mayorista{% endblock %}
{% block page_class %}narrow{% endblock %}

{% block content %}
<div class="card">
  <h1>Elegí una nueva contraseña</h1>
  <p class="subtitle">El link es de un solo uso y ya se consume al enviar este formulario.</p>

  <form method="POST" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="password">Nueva contraseña</label>
      <input type="password" id="password" name="password" required minlength="8">
      <span class="hint">Mínimo 8 caracteres.</span>
    </div>
    <div class="field">
      <label for="password2">Repetir contraseña</label>
      <input type="password" id="password2" name="password2" required minlength="8">
    </div>
    <button type="submit" class="btn btn-block">Cambiar contraseña</button>
  </form>
</div>
{% endblock %}
